<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Ensino Sem Barreiras - ESB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <div class="esb-header">
            <p><b>Ensino Sem Barreiras</b><p>
        </div>

        <div class="infos-header">
            <p class="esq-header"><a href="home.html" class="link-light link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover">Início</a></p>
            <p class="esq-header"><a href="produtos.html" class="link-light link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover">Aulas</a></p>
            <p class="esq-header"><a href="sobre.html" class="link-light link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover">Sobre</a></p>
        </div>
    </header>

    <div class="cabecalho-form">
        <p class="titulo-form"><b>Quer fazer parte do Ensino Sem Barreiras?</b></p>
        <p class="desc-form">Conte-nos um pouco sobre você.</p>
    </div>

    <div class="form">
        <form action="#" method="post" class="form-cadastro">
            Nome: <input type="text" name="usuario" id="usuario" placeholder="José da Silva" required class="form-control"><br>
            E-mail: <input type="text" name="email" id="usuario" placeholder="fulano@email.com" required class="form-control"><br>
            Senha: <input type="password" name="senha" id="senha" placeholder="senha123" required class="form-control"><br>
            <p class="texto-objetivo"><b>Qual é o seu objetivo?</b></p>
            <input type="radio" id="objetivo-enem" name="objetivo"> Preparação para o ENEM<br>
            <input type="radio" id="objetivo-portugues" name="objetivo"> Melhorar meu Português<br>
            <input type="radio" id="objetivo-conteudos" name="objetivo"> Aprender novos conteúdos<br>
            <input type="radio" id="objetivo-outro" name="objetivo"> Outro<br>
            <input type="radio" id="objetivo-seguinte" name="objetivo"> Outra coisa<br>

            <a href="home.html" class="bt-cadastro"><button type="button" class="btn btn-danger">Cadastrar</button></a>
        </form>
    </div>
</body>
</html>
